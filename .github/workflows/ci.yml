name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create solution
        run: |
          dotnet new sln -n BookStore
          dotnet sln add CRUD_dotNet/CRUD_dotNet.csproj
          dotnet sln add BookStore.Core/BookStore.Core.csproj
          dotnet sln add BookStore.Application/BookStore.Application.csproj
          dotnet sln add BookStore.DataAccess/BookStore.DataAccess.csproj
          dotnet sln add BookStore.Infrastructure/BookStore.Infrastructure.csproj

      - name: Restore
        run: dotnet restore BookStore.sln

      - name: Verify formatting
        run: dotnet format BookStore.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build BookStore.sln --no-restore -c Release
